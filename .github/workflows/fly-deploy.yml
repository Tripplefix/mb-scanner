name: Deploy to Fly.io

# Runs on every push to main, or manually from the Actions tab (Run workflow).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group   # prevent overlapping deploys
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Read the app name and region straight from fly.toml.
      - name: Read config
        id: cfg
        run: |
          APP=$(grep -E '^app ' fly.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          REGION=$(grep -E '^primary_region' fly.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      # Create the app the first time (no-op if it already exists).
      - name: Ensure app exists
        run: flyctl apps create "${{ steps.cfg.outputs.app }}" --org personal || true

      # Create the persistent volume the first time (no-op if one already exists).
      - name: Ensure volume exists
        run: |
          APP="${{ steps.cfg.outputs.app }}"
          if ! flyctl volumes list -a "$APP" 2>/dev/null | grep -q mb_data; then
            flyctl volumes create mb_data -a "$APP" \
              --region "${{ steps.cfg.outputs.region }}" --size 1 --yes
          fi

      - name: Deploy
        run: flyctl deploy --remote-only -a "${{ steps.cfg.outputs.app }}"
