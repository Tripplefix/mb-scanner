# fly.toml — Fly.io app configuration for MB Scanner.
# Run `fly launch` (it may rename the app) or edit `app` below, then `fly deploy`.

app = "mb-scanner"
primary_region = "zrh"   # Zurich — closest to Switzerland; change if you prefer

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"

# Persistent volume so the SQLite database survives restarts/redeploys.
[mounts]
  source = "mb_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # scales to zero when idle (cheapest)

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
